name: Update Profile Art

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/build_profile.py"

permissions:
  contents: write

jobs:
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_profile.py --fetch

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg assets/hero-*.svg data/contributions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh profile SVGs and contribution data [skip ci]" && git push)
