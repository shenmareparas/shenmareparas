name: Update Profile Art

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/generate_heatmap.py"

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate animated contribution heatmap
        run: |
          python3 scripts/generate_heatmap.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh contribution heatmap [skip ci]" && git push)

