<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" width="600" height="580" role="img" aria-labelledby="title desc">
<title id="title">Paras Shenmare — Mobile, web &amp; creative systems.</title><desc id="desc">Mobile developer console showing client architecture spec, engineering principles, and core pillars.</desc>
<defs></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.fg {fill:#18181b} .muted {fill:#71717a} .blue {fill:#0284c7} .gold {fill:#d97706}
.mono {font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:1px}
.rule {fill:none;stroke:#e4e4e7;stroke-width:1}
